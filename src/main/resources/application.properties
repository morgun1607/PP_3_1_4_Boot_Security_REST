spring.application.name=pp-3-1-3-boot-security-bootstrap
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/spring_security?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${KATA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
