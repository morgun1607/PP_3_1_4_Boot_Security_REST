<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login page</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head><body class="bg-light"><form class="mx-auto mt-5" style="width:100%;max-width:330px;padding:15px" th:action="@{/login}" method="post"><h3 class="font-weight-bold mb-3">Please sign in</h3><div class="alert alert-danger" th:if="${param.error}">Invalid email or password</div><input type="email" name="username" class="form-control" placeholder="Email address" aria-label="Email address" required autofocus><input type="password" name="password" class="form-control" placeholder="Password" aria-label="Password" required><button class="btn btn-lg btn-primary btn-block mt-2" type="submit">Sign in</button></form></body></html>
